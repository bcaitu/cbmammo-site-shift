name: opq_embed_dinov2
arm: opaque
seed: 0
out_root: runs
encoder:
  name: vit_base_patch14_dinov2.lvd142m   # swap: vit_large_patch14_dinov2.lvd142m, efficientnet_b5 (+checkpoint: mammo-clip), convnext_base...
  pretrained: true
  checkpoint: null
  token_pool: 2              # avg-pool the patch grid 2x2 before fusion
  trainable_blocks: 0        # 0 = fully frozen
model:
  d: 512
  fusion_layers: 2
  heads: 8
  opaque_queries: 8
  z_dim: 512
  aux_lambda: 0.1            # opaque arm: weight of auxiliary concept heads (matched control)
  cb_detach: true            # targets read detached concepts (no leakage through the bottleneck)
  dropout: 0.1
data:
  train_manifests: [manifests/cbis_ddsm.jsonl, manifests/vindr.jsonl, manifests/embed.jsonl]
  test_manifests: [manifests/cmmd.jsonl, manifests/cdd_cesm.jsonl, manifests/inbreast.jsonl]
  size: [1036, 644]          # multiple of 14 for ViT/14; per view
  clahe: true
  cache_dir: cache/prep
  dump_train: true
train:
  epochs: 20
  batch_size: 16
  lr: 3.0e-4
  wd: 0.05
  amp: true
  workers: 16
  patience: 4
  class_weight_power: 0.5
  log_every: 100
  embed_neg_ratio: 1.0       # EMBED BI-RADS-1/no-finding breasts resampled fresh each epoch, 1:1 to EMBED positives
  dataset_balanced_val: true # checkpoint selection averages val macro-F1 across datasets with EQUAL weight (EMBED val is much larger)
